name: Lock event mapping

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lock-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test with Home Assistant 2026.9.4
        run: |
          docker run --rm --entrypoint python \
            -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace \
            ghcr.io/home-assistant/home-assistant:2026.9.4 \
            -m unittest discover -s test -p lock_event_mapping.py -v
